<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcureFlow Enterprise Purchasing Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-[#111827] border-r border-gray-800 flex flex-col justify-between no-print">
        <div>
            <div class="p-5 flex items-center space-x-3 border-b border-gray-800">
                <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold text-xl"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div>
                    <h1 class="font-bold text-lg text-white">ProcureFlow</h1>
                    <p class="text-xs text-indigo-400">Enterprise Suite v4.2</p>
                </div>
            </div>
            <div class="p-4 space-y-1">
                <p class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold px-3 mb-2">Main Menu</p>
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-600 text-white"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard & PR List</span></button>
                <button onclick="switchTab('create-pr')" id="nav-create-pr" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-file-circle-plus w-5"></i><span>Create Purchase Req</span></button>
                <button onclick="switchTab('po-list')" id="nav-po-list" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-file-invoice-dollar w-5"></i><span>Purchase Orders</span></button>
                <button onclick="switchTab('suppliers')" id="nav-suppliers" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-truck-ramp-box w-5"></i><span>Supplier & Catalog</span></button>
                <button onclick="switchTab('analytics')" id="nav-analytics" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-chart-line w-5"></i><span>Advanced Analytics</span></button>
            </div>
            <div class="p-4 space-y-1 pt-2">
                <p class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold px-3 mb-2">Administration</p>
                <button onclick="switchTab('users')" id="nav-users" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-users-gear w-5"></i><span>User Management</span></button>
                <button onclick="switchTab('audit')" id="nav-audit" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-shield-halved w-5"></i><span>Audit & Logs</span></button>
            </div>
        </div>
        <div class="p-4 border-t border-gray-800 bg-gray-900/50 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div id="current-user-avatar" class="w-9 h-9 rounded-full bg-indigo-500 flex items-center font-bold justify-center text-white text-sm">AV</div>
                <div>
                    <p id="current-user-name" class="text-xs font-semibold text-white">Alexander Vance</p>
                    <p id="current-user-role" class="text-[10px] text-gray-400">Executive / Head Admin</p>
                </div>
            </div>
            <button onclick="openRoleSwitcher()" class="text-gray-400 hover:text-white text-xs bg-gray-800 px-2.5 py-1.5 rounded"><i class="fa-solid fa-right-left"></i></button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Top Navbar -->
        <header class="h-16 bg-[#111827] border-b border-gray-800 px-6 flex items-center justify-between no-print">
            <div class="flex items-center space-x-4">
                <h2 id="page-title" class="text-lg font-bold text-white">Dashboard & Purchase Requisitions</h2>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs bg-indigo-900/50 border border-indigo-700 text-indigo-300 px-3 py-1 rounded-full"><i class="fa-solid fa-building-columns mr-1"></i> Currency: PHP (₱)</span>
                <div class="relative">
                    <button onclick="toggleNotifications()" class="relative p-2 text-gray-400 hover:text-white bg-gray-800 rounded-full"><i class="fa-solid fa-bell"></i><span id="notif-badge" class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span></button>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Body -->
        <div class="flex-1 overflow-y-auto p-6 custom-scrollbar" id="main-content-area">
            <!-- Content gets dynamically rendered here -->
        </div>
    </main>

    <!-- Script Application Logic -->
    <script>
        let currentTab = 'dashboard';
        let currentUser = { id: 'USR-001', name: 'Alexander Vance', role: 'Head Admin', department: 'Executive' };

        const users = [
            { id: 'USR-001', username: 'headadmin', name: 'Alexander Vance', department: 'Executive', role: 'Head Admin', status: 'Active' },
            { id: 'USR-002', username: 'it_head', name: 'Marcus Brody', department: 'IT', role: 'Department Head', status: 'Active' },
            { id: 'USR-003', username: 'finance_head', name: 'Elena Fisher', department: 'Finance', role: 'Finance Head', status: 'Active' },
            { id: 'USR-004', username: 'purchasing_off', name: 'Victor Sullivan', department: 'Purchasing', role: 'Purchasing Officer', status: 'Active' },
            { id: 'USR-005', username: 'fnb_head', name: 'Chloe Frazer', department: 'F&B', role: 'Department Head', status: 'Active' },
            { id: 'USR-006', username: 'house_staff', name: 'Nadine Ross', department: 'Housekeeping', role: 'Staff', status: 'Active' },
            { id: 'USR-007', username: 'eng_head', name: 'Sam Drake', department: 'Engineering Materials', role: 'Department Head', status: 'Active' }
        ];

        let prList = [
            { id: 'PR-2026-001', date: '2026-08-01', department: 'IT', requester: 'Marcus Brody', priority: 'High', status: 'Approved', total: 5900.00, items: [{ desc: 'Enterprise Switch', qty: 2, price: 2950 }] },
            { id: 'PR-2026-002', date: '2026-08-03', department: 'Office Supplies', requester: 'Nadine Ross', priority: 'Normal', status: 'Pending Approval', total: 1390.00, items: [{ desc: 'A4 Bond Paper Box', qty: 10, price: 139 }] },
            { id: 'PR-2026-003', date: '2026-08-04', department: 'F&B', requester: 'Chloe Frazer', priority: 'Urgent', status: 'Converted to PO', total: 3200.00, items: [{ desc: 'Commercial Coffee Beans', qty: 4, price: 800 }] }
        ];

        let prFormItems = [
            { desc: '', qty: 1, unit: 'pcs', category: 'IT Hardware', price: 0 }
        ];

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('aside button[id^="nav-"]').forEach(btn => btn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-white");
            const activeBtn = document.getElementById('nav-' + tab);
            if(activeBtn) activeBtn.className = "w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-600 text-white";
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('main-content-area');
            const title = document.getElementById('page-title');
            if(currentTab === 'dashboard') {
                title.innerText = "Dashboard & Purchase Requisitions";
                container.innerHTML = `
                    <div class="grid grid-cols-4 gap-4 mb-6">
                        <div class="bg-gray-800/60 border border-gray-700/50 p-4 rounded-xl"><p class="text-xs text-gray-400">Total Requisitions</p><h3 class="text-2xl font-bold mt-1">${prList.length} <span class="text-xs text-emerald-400">+12% MoM</span></h3></div>
                        <div class="bg-gray-800/60 border border-gray-700/50 p-4 rounded-xl"><p class="text-xs text-gray-400">Pending Approvals</p><h3 class="text-2xl font-bold mt-1 text-amber-400">${prList.filter(p=>p.status==='Pending Approval').length} <span class="text-xs text-gray-400">Requires Action</span></h3></div>
                        <div class="bg-gray-800/60 border border-gray-700/50 p-4 rounded-xl"><p class="text-xs text-gray-400">Ready for PO Conversion</p><h3 class="text-2xl font-bold mt-1 text-indigo-400">${prList.filter(p=>p.status==='Approved').length} <span class="text-xs text-gray-400">Purchasing Dept</span></h3></div>
                        <div class="bg-gray-800/60 border border-gray-700/50 p-4 rounded-xl"><p class="text-xs text-gray-400">Total PR Value</p><h3 class="text-2xl font-bold mt-1 text-emerald-400">₱${prList.reduce((acc,curr)=>acc+curr.total,0).toLocaleString(undefined, {minimumFractionDigits:2})}</h3></div>
                    </div>
                    <div class="bg-gray-800/60 border border-gray-700/50 rounded-xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-white">Recent Purchase Requisitions</h3>
                            <button onclick="switchTab('create-pr')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium">+ Create New PR</button>
                        </div>
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-gray-700 text-xs text-gray-400 uppercase">
                                    <th class="py-3 px-4">PR Number</th>
                                    <th class="py-3 px-4">Request Date</th>
                                    <th class="py-3 px-4">Department</th>
                                    <th class="py-3 px-4">Requester</th>
                                    <th class="py-3 px-4">Priority</th>
                                    <th class="py-3 px-4">Status</th>
                                    <th class="py-3 px-4">Total Amount</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-700/50 text-sm">
                                ${prList.map(pr => `
                                    <tr class="hover:bg-gray-700/20">
                                        <td class="py-3 px-4 font-medium text-indigo-400">${pr.id}</td>
                                        <td class="py-3 px-4 text-gray-300">${pr.date}</td>
                                        <td class="py-3 px-4 text-gray-300">${pr.department}</td>
                                        <td class="py-3 px-4 text-gray-300">${pr.requester}</td>
                                        <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-semibold ${pr.priority==='High'?'bg-amber-900/40 text-amber-300':pr.priority==='Urgent'?'bg-red-900/40 text-red-300':'bg-blue-900/40 text-blue-300'}">${pr.priority}</span></td>
                                        <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-900/40 text-emerald-300">${pr.status}</span></td>
                                        <td class="py-3 px-4 font-semibold text-white">₱${pr.total.toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if(currentTab === 'create-pr') {
                title.innerText = "Create Purchase Requisition";
                let calcTotal = prFormItems.reduce((acc, item) => acc + (Number(item.qty) * Number(item.price)), 0);
                container.innerHTML = `
                    <div class="bg-gray-800/60 border border-gray-700/50 rounded-xl p-6 max-w-5xl mx-auto">
                        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                            <div>
                                <h3 class="font-bold text-white text-lg">New Purchase Requisition Form</h3>
                                <p class="text-xs text-gray-400">Fill in department details and line items for multi-tier approval routing.</p>
                            </div>
                            <button onclick="switchTab('dashboard')" class="text-gray-400 hover:text-white text-sm bg-gray-700/50 px-3 py-1.5 rounded"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Dashboard</button>
                        </div>
                        <div class="grid grid-cols-3 gap-4 mb-6">
                            <div>
                                <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Department</label>
                                <select id="pr-dept" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
                                    <option>IT</option>
                                    <option>Finance</option>
                                    <option>Purchasing</option>
                                    <option>F&B</option>
                                    <option>Housekeeping</option>
                                    <option>Engineering Materials</option>
                                    <option>Executive</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Priority Level</label>
                                <select id="pr-priority" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
                                    <option>Normal</option>
                                    <option>High</option>
                                    <option>Urgent</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Required Delivery Date</label>
                                <input type="date" id="pr-date" value="2026-08-15" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white">
                            </div>
                        </div>

                        <div class="mb-6">
                            <div class="flex justify-between items-center mb-3">
                                <h4 class="text-sm font-bold text-gray-300 uppercase tracking-wider">Line Items</h4>
                                <button onclick="addPrRow()" class="bg-indigo-600/30 border border-indigo-500 text-indigo-300 hover:bg-indigo-600 hover:text-white px-3 py-1 rounded text-xs font-semibold">+ Add Line Item</button>
                            </div>
                            <table class="w-full text-left border-collapse">
                               <thead>
                                    <tr class="border-b border-gray-700 text-xs text-gray-400 uppercase">
                                        <th class="py-2 px-3">Item Description</th>
                                        <th class="py-2 px-3 w-24">Qty</th>
                                        <th class="py-2 px-3 w-28">Unit</th>
                                        <th class="py-2 px-3 w-40">Category</th>
                                        <th class="py-2 px-3 w-32">Est. Price (₱)</th>
                                        <th class="py-2 px-3 w-32 text-right">Line Total</th>
                                        <th class="py-2 px-3 w-16 text-center">Action</th>
                                    </tr>
                               </thead>
                               <tbody class="divide-y divide-gray-700/50 text-sm">
                                    ${prFormItems.map((item, idx) => `
                                        <tr>
                                            <td class="py-2 px-3"><input type="text" value="${item.desc}" oninput="updatePrItem(${idx}, 'desc', this.value)" placeholder="Enter item description..." class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white text-xs"></td>
                                            <td class="py-2 px-3"><input type="number" value="${item.qty}" min="1" oninput="updatePrItem(${idx}, 'qty', this.value)" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white text-xs"></td>
                                            <td class="py-2 px-3"><input type="text" value="${item.unit}" oninput="updatePrItem(${idx}, 'unit', this.value)" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white text-xs"></td>
                                            <td class="py-2 px-3">
                                                <select oninput="updatePrItem(${idx}, 'category', this.value)" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white text-xs">
                                                    <option ${item.category==='IT Hardware'?'selected':''}>IT Hardware</option>
                                                    <option ${item.category==='Office Supplies'?'selected':''}>Office Supplies</option>
                                                    <option ${item.category==='F&B Ingredients'?'selected':''}>F&B Ingredients</option>
                                                    <option ${item.category==='Housekeeping'?'selected':''}>Housekeeping</option>
                                                    <option ${item.category==='Engineering'?'selected':''}>Engineering</option>
                                                </select>
                                            </td>
                                            <td class="py-2 px-3"><input type="number" value="${item.price}" min="0" step="0.01" oninput="updatePrItem(${idx}, 'price', this.value)" class="w-full bg-gray-900 border border-gray-700 rounded p-1.5 text-white text-xs"></td>
                                            <td class="py-2 px-3 text-right font-semibold text-white">₱${(Number(item.qty)*Number(item.price)).toFixed(2)}</td>
                                            <td class="py-2 px-3 text-center"><button onclick="removePrRow(${idx})" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button></td>
                                        </tr>
                                    `).join('')}
                               </tbody>
                            </table>
                        </div>

                        <div class="flex justify-between items-center border-t border-gray-700 pt-4">
                            <div class="text-lg font-bold text-white">Total Requisition Value: <span class="text-emerald-400">₱${calcTotal.toFixed(2)}</span></div>
                            <button onclick="submitPr()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-lg font-semibold text-sm shadow-lg shadow-indigo-600/30"><i class="fa-solid fa-paper-plane mr-2"></i> Submit for Approval</button>
                        </div>
                    </div>
                `;
            } else if(currentTab === 'users') {
                title.innerText = "User Management & Role Permissions";
                container.innerHTML = `
                    <div class="bg-gray-800/60 border border-gray-700/50 rounded-xl p-6">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h3 class="font-bold text-white text-lg">User Accounts & Role Permissions</h3>
                                <p class="text-xs text-gray-400">Head Admin can edit specific columns per row (ID, Full Name, Department, Position/Role) or reset passwords.</p>
                            </div>
                        </div>
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-gray-700 text-xs text-gray-400 uppercase">
                                    <th class="py-3 px-4">User ID / Username <button onclick="editColumn('id')" class="text-indigo-400 hover:text-white ml-1 text-[10px] bg-indigo-900/40 px-1.5 py-0.5 rounded">Edit Col</button></th>
                                    <th class="py-3 px-4">Full Name <button onclick="editColumn('name')" class="text-indigo-400 hover:text-white ml-1 text-[10px] bg-indigo-900/40 px-1.5 py-0.5 rounded">Edit Col</button></th>
                                    <th class="py-3 px-4">Department <button onclick="editColumn('department')" class="text-indigo-400 hover:text-white ml-1 text-[10px] bg-indigo-900/40 px-1.5 py-0.5 rounded">Edit Col</button></th>
                                    <th class="py-3 px-4">Position / Role <button onclick="editColumn('role')" class="text-indigo-400 hover:text-white ml-1 text-[10px] bg-indigo-900/40 px-1.5 py-0.5 rounded">Edit Col</button></th>
                                    <th class="py-3 px-4">Status</th>
                                    <th class="py-3 px-4 text-right">Admin Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-700/50 text-sm">
                                ${users.map(u => `
                                    <tr class="hover:bg-gray-700/20">
                                        <td class="py-3 px-4 font-medium text-indigo-400">
                                            <span onclick="editField('${u.id}', 'id')" class="cursor-pointer hover:underline" title="Click to edit ID/Username">${u.id} (${u.username}) <i class="fa-solid fa-pen text-[10px] text-gray-500"></i></span>
                                        </td>
                                        <td class="py-3 px-4 text-white">
                                            <span onclick="editField('${u.id}', 'name')" class="cursor-pointer hover:underline" title="Click to edit Name">${u.name} <i class="fa-solid fa-pen text-[10px] text-gray-500"></i></span>
                                        </td>
                                        <td class="py-3 px-4 text-gray-300">
                                            <span onclick="editField('${u.id}', 'department')" class="cursor-pointer hover:underline" title="Click to edit Department">${u.department} <i class="fa-solid fa-pen text-[10px] text-gray-500"></i></span>
                                        </td>
                                        <td class="py-3 px-4 text-gray-300">
                                            <span onclick="editField('${u.id}', 'role')" class="cursor-pointer hover:underline" title="Click to edit Role">${u.role} <i class="fa-solid fa-pen text-[10px] text-gray-500"></i></span>
                                        </td>
                                        <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-900/40 text-emerald-300">${u.status}</span></td>
                                        <td class="py-3 px-4 text-right space-x-2">
                                            <button onclick="editUserModal('${u.id}')" class="bg-indigo-600/30 border border-indigo-500/50 text-indigo-300 hover:bg-indigo-600 hover:text-white px-2.5 py-1 rounded text-xs"><i class="fa-solid fa-pen-to-square"></i> Edit Row</button>
                                            <button onclick="resetPassword('${u.id}')" class="bg-amber-600/30 border border-amber-500/50 text-amber-300 hover:bg-amber-600 hover:text-white px-2.5 py-1 rounded text-xs"><i class="fa-solid fa-key"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                title.innerText = "Module Placeholder";
                container.innerHTML = `<div class="bg-gray-800/60 border border-gray-700/50 p-6 rounded-xl"><p class="text-gray-300">Module view loaded successfully.</p></div>`;
            }
        }

        function addPrRow() {
            prFormItems.push({ desc: '', qty: 1, unit: 'pcs', category: 'General', price: 0 });
            renderContent();
        }

        function removePrRow(idx) {
            if(prFormItems.length === 1) {
                alert("Requisition must have at least one line item.");
                return;
            }
            prFormItems.splice(idx, 1);
            renderContent();
        }

        function updatePrItem(idx, field, val) {
            prFormItems[idx][field] = val;
        }

        function submitPr() {
            const dept = document.getElementById('pr-dept').value;
            const priority = document.getElementById('pr-priority').value;
            const date = document.getElementById('pr-date').value;
            const total = prFormItems.reduce((acc, item) => acc + (Number(item.qty) * Number(item.price)), 0);

            if(total <= 0) {
                alert("Please add at least one line item with valid pricing.");
                return;
            }

            const newPrId = `PR-2026-00${prList.length + 1}`;
            prList.unshift({
                id: newPrId,
                date: date,
                department: dept,
                requester: currentUser.name,
                priority: priority,
                status: 'Pending Approval',
                total: total,
                items: [...prFormItems]
            });

            prFormItems = [{ desc: '', qty: 1, unit: 'pcs', category: 'IT Hardware', price: 0 }];
            alert(`Purchase Requisition ${newPrId} successfully submitted for approval!`);
            switchTab('dashboard');
        }

        function editField(id, field) {
            const user = users.find(u => u.id === id);
            if(!user) return;
            if(field === 'role') {
                const roles = ['Head Admin', 'Department Head', 'Finance Head', 'Purchasing Officer', 'Staff', 'Director'];
                let promptMsg = `Select new Position / Role for ${user.name}:\n`;
                roles.forEach((r, idx) => { promptMsg += `${idx + 1}. ${r}\n`; });
                const choice = prompt(promptMsg + `\nEnter number (1-${roles.length}):`, "1");
                const num = parseInt(choice);
                if(num >= 1 && num <= roles.length) {
                    user.role = roles[num - 1];
                    renderContent();
                    alert(`Successfully updated role for user ${id} to ${user.role}.`);
                }
            } else {
                const newVal = prompt(`Edit ${field.toUpperCase()} for ${user.name}:`, user[field]);
                if(newVal !== null && newVal.trim() !== '') {
                    user[field] = newVal.trim();
                    renderContent();
                    alert(`Successfully updated ${field} for user ${id}.`);
                }
            }
        }

        function editColumn(field) {
            const fieldNames = { id: 'User ID / Username', name: 'Full Name', department: 'Department', role: 'Position / Role' };
            const targetId = prompt(`Enter User ID (e.g. USR-001) whose ${fieldNames[field]} you want to update:`);
            if(targetId) {
                editField(targetId.trim(), field);
            }
        }

        function editUserModal(id) {
            const user = users.find(u => u.id === id);
            if(!user) return;
            const newId = prompt("Edit User ID / Username:", user.id);
            const newName = prompt("Edit Full Name:", user.name);
            const newDept = prompt("Edit Department:", user.department);
            const roles = ['Head Admin', 'Department Head', 'Finance Head', 'Purchasing Officer', 'Staff', 'Director'];
            let promptMsg = `Select Position / Role for ${newName || user.name}:\n`;
            roles.forEach((r, idx) => { promptMsg += `${idx + 1}. ${r}\n`; });
            const choice = prompt(promptMsg + `\nEnter number (1-${roles.length}):`, "1");
            const num = parseInt(choice);
            
            if(newId) user.id = newId;
            if(newName) user.name = newName;
            if(newDept) user.department = newDept;
            if(num >= 1 && num <= roles.length) user.role = roles[num - 1];

            renderContent();
            alert("User row successfully updated.");
        }

        function resetPassword(id) {
            const user = users.find(u => u.id === id);
            if(!user) return;
            const newPwd = prompt(`Enter new temporary password for ${user.name} (${user.id}):`);
            if(newPwd) {
                alert(`Password successfully updated and issued for user ${user.id}.`);
            }
        }

        function openRoleSwitcher() {
            const role = prompt("Switch role / user:\n1. Alexander Vance (Head Admin)\n2. Marcus Brody (IT Head)\n3. Elena Fisher (Finance)\n4. Victor Sullivan (Purchasing)", "Head Admin");
            if(role) {
                currentUser.name = role;
                document.getElementById('current-user-name').innerText = role;
                alert("Active user role switched successfully.");
            }
        }

        function toggleNotifications() { alert("No new notifications."); }

        renderContent();
    </script>
</body>
</html>
